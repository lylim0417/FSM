wrapper:
    recipe: wrapper|default_flip
    validate_first: False
    max_epochs: 1

arch:
    model:
        file: depth/FixedCalibFSM

        # Spatio-temporal setup
        context: [-1, 1]
        dataset: ddad
        cameras: [1, 5, 6, 7, 8, 9]

        # Neighbor indices refer to the six-camera ordering above,
        # not the physical DDAD camera IDs directly.
        camera_neighboring_pairs:
            - [2, 1]
            - [0, 3]
            - [4, 0]
            - [1, 5]
            - [5, 2]
            - [4, 3]

        # Self-supervised loss weights
        mono_loss_coeff: 1.0
        stereo_loss_coeff: 0.1

        # Critical PhD guardrails
        use_gt_pose: False
        gt_to_scale_injection: False

        # Keep networks trainable
        freeze_depthnet: False
        freeze_posenet: False

        # One output scale for initial debugging
        num_scales: 1

    networks:
        depth:
            recipe: networks/mono_depth_net|resnet18
            depth_range: [0.0005, 0.3]
            scale_intrinsics: True
            num_scales: 1

        pose:
            recipe: networks/pose_net|resnet18

    losses:
        depth_selfsup:
            recipe: losses/depth|self_supervised

        smoothness:
            recipe: losses/depth|smoothness

optimizers:
    depth:
        recipe: optimizers|adam_20_05_step
        lr: 2.0e-4

    pose:
        recipe: optimizers|adam_20_05_step
        lr: 2.0e-4

datasets:
    train:
        recipe: datasets/ddad|train_self_supervised_MR

        # Temporal supervision
        context: [-1, 1]

        # No GT depth.
        # Pose is loaded only as dataset geometry/calibration metadata;
        # FixedCalibFSM does NOT inject GT ego-motion magnitude into PoseNet.
        labels: [pose, intrinsics]
        labels_context: [pose]

        # One synchronized six-camera sample per dataset item
        cameras: [[1, 5, 6, 7, 8, 9]]

        # Keep first smoke test small in GPU memory.
        dataloader:
            batch_size: 1
            num_workers: 0
            pin_memory: False
